<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat</title>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#120a2e"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--a1:#ffc861;--a2:#ff4fa3;--a3:#19e3a1;--b1:#341a7a;--b2:#120a2e;--b3:#06040d;--tx:#f4efe2;--tx2:#b7afd8;--gl:rgba(255,255,255,.08);--bar:rgba(20,12,48,.82);--avbg:#2a1b5e;--me:#2a1030;--mx:#ffd77a;--my:#ff9ac9}
[data-t=neon]{--a1:#4fd8ff;--a2:#8a6bff;--a3:#5ff0c0;--b1:#0b2a6e;--b2:#06122e;--b3:#02050f;--bar:rgba(6,18,46,.82);--avbg:#0b2a6e;--mx:#8fe6ff;--my:#b9a6ff}
[data-t=red]{--a1:#ffd15c;--a2:#ff3b5c;--a3:#ff9a3c;--b1:#6e0f1f;--b2:#2e0610;--b3:#0f0205;--bar:rgba(46,6,16,.82);--avbg:#5a0c19;--mx:#ffe08a;--my:#ff8a9e}
[data-t=jade]{--a1:#7dffcb;--a2:#ffd15c;--a3:#4fd8ff;--b1:#04483a;--b2:#021f1a;--b3:#010a08;--bar:rgba(2,31,26,.82);--avbg:#04382e;--mx:#a9ffdc;--my:#ffe9a0}
[data-t=sakura]{--a1:#ff5fa2;--a2:#b06bff;--a3:#19c39a;--b1:#ffd6e8;--b2:#ffe9f2;--b3:#fff5fa;--tx:#3a1230;--tx2:#8a5d7c;--gl:rgba(255,255,255,.7);--bar:rgba(255,255,255,.82);--avbg:#fff;--me:#3a1230;--mx:#ffb3d4;--my:#e0c4ff}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--b3);color:var(--tx);height:100dvh;overflow:hidden}
.h{display:none!important}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input{font:inherit;color:var(--tx);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);border-radius:14px;padding:12px 14px;width:100%;background:var(--gl);outline:0}
input:focus{border-color:var(--a1);box-shadow:0 0 14px color-mix(in srgb,var(--a1) 50%,transparent)}
::placeholder{color:var(--tx2)}
#fx{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 60% at 20% 0,var(--b1),var(--b2) 55%,var(--b3))}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:fl 7s ease-in-out infinite,au 12s linear infinite}
.pt{position:absolute;bottom:-12px;border-radius:50%;animation:ri linear infinite}
body.nofx .pt,body.nofx .orb{display:none}
#shell{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden}
@media(min-width:700px){#shell{height:min(calc(100dvh - 40px),880px);margin:20px auto;border-radius:30px;border:1px solid color-mix(in srgb,var(--a1) 45%,transparent);box-shadow:0 0 70px color-mix(in srgb,var(--a1) 35%,transparent);background:rgba(10,6,30,.25)}}
.pg{position:absolute;inset:0;display:flex;flex-direction:column}
.ov{background:var(--b2);z-index:5}
#call{z-index:9;background:var(--b3)}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:var(--bar);border-bottom:1px solid color-mix(in srgb,var(--a1) 35%,transparent);position:relative;min-height:56px}
.top::after,.sb::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--a1),var(--a2),transparent);animation:ln 2.4s linear infinite}
.ttl{font-size:32px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--a1),#fff4cf,var(--a2),var(--a3),var(--a1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
.gw{display:inline-block;animation:gl 2.4s ease-in-out infinite}
#main{flex:1;overflow:auto;padding:10px 0 110px}
.row{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;padding:12px 16px;margin:0 12px 10px;border-radius:18px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--a1) 12%,transparent);animation:si .5s both;cursor:pointer}
.row .swp{position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sw 3.8s infinite}
.mid{flex:1;min-width:0}.mid b{font-weight:600;display:flex;align-items:center;gap:6px}
.mid small,.rt small{color:var(--tx2);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:#8a8aa0;display:inline-block}.dot.on{background:var(--a3);box-shadow:0 0 8px var(--a3)}
.bd{min-width:22px;height:22px;border-radius:11px;background:#ff4f7a;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pu 1.6s infinite;padding:0 6px;font-style:normal}
.btn{background:linear-gradient(135deg,var(--mx),var(--my));color:var(--me);border-radius:12px;padding:9px 16px;font-weight:800;box-shadow:0 0 16px color-mix(in srgb,var(--a1) 40%,transparent)}
.btn.g{background:var(--gl);color:var(--tx);box-shadow:none;border:1px solid color-mix(in srgb,var(--a1) 30%,transparent)}
.req{margin:0 12px 12px;padding:12px 16px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 30%,transparent),color-mix(in srgb,var(--a2) 28%,transparent),color-mix(in srgb,var(--a3) 22%,transparent),color-mix(in srgb,var(--a1) 30%,transparent));background-size:200% 100%;animation:sh 4s linear infinite,pg 2s infinite;border:1px solid var(--a1)}
.req .row{margin:8px 0 0;animation:none}
.empty{padding:50px 24px;text-align:center;color:var(--tx2)}
.sb{position:relative;overflow:hidden;display:flex;gap:8px;margin:12px 16px;padding:6px;border-radius:16px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent)}
.sb input{border:0;background:none;box-shadow:none}
.tabs{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;padding:10px 0;border-radius:26px;background:var(--bar);border:1px solid color-mix(in srgb,var(--a1) 45%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--a1) 25%,transparent)}
.tabs button{flex:1;color:var(--tx2);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button.on{color:var(--a1)}.tabs button.on svg{filter:drop-shadow(0 0 8px var(--a1))}
.tabs button.on::before{content:"";position:absolute;top:-11px;width:36px;height:3px;border-radius:2px;background:var(--a1);box-shadow:0 0 12px var(--a1)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{position:relative;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.av .in{position:absolute;inset:0;border-radius:50%;background:var(--avbg);color:var(--a1);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.av.rg::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--a1),var(--a2),var(--a3),var(--a1));animation:sp 4s linear infinite;box-shadow:0 0 14px color-mix(in srgb,var(--a1) 60%,transparent)}
.av.rg .in{inset:2px}
.av img{width:100%;height:100%;object-fit:cover}
.ib{width:40px;height:40px;border-radius:50%;background:var(--gl);color:var(--a1);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px color-mix(in srgb,var(--a1) 35%,transparent);flex:none;cursor:pointer}
.ib.rec{background:#ff4f7a;color:#fff;animation:pu 1s infinite}
#msgs{flex:1;overflow:auto;padding:16px;position:relative}
.m{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;animation:si .4s both}
.m.me{flex-direction:row-reverse}
.bb{position:relative;overflow:hidden;max-width:72%;padding:10px 14px;border-radius:4px 18px 18px 18px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 25%,transparent);white-space:pre-wrap;word-break:break-word}
.me .bb{border-radius:18px 4px 18px 18px;border:0;background:linear-gradient(135deg,var(--mx),var(--my),var(--mx));background-size:200% 100%;animation:sh 4s linear infinite;color:var(--me);font-weight:500;box-shadow:0 4px 22px color-mix(in srgb,var(--a2) 40%,transparent)}
.pic{max-width:200px;max-height:240px;border-radius:10px;display:block;cursor:zoom-in}
audio{max-width:200px;height:36px}
.bar{display:flex;gap:8px;margin:8px 12px calc(12px + env(safe-area-inset-bottom));padding:8px;border-radius:28px;background:var(--bar);border:1px solid color-mix(in srgb,var(--a1) 45%,transparent);align-items:center;box-shadow:0 0 22px color-mix(in srgb,var(--a1) 22%,transparent)}
.bar input[type=text],.bar #inp{border:0;background:none;box-shadow:none;padding:8px 4px}
.send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--mx),var(--my));color:var(--me);display:flex;align-items:center;justify-content:center;animation:pg 1.8s infinite;flex:none}
#emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:0 12px;padding:8px;border-radius:18px;background:var(--bar);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);font-size:24px;text-align:center}
#emo span{cursor:pointer;padding:4px;border-radius:8px}#emo span:active{background:var(--gl)}
.box{max-width:360px;width:100%;margin:auto;padding:30px 26px;display:grid;gap:12px;text-align:center}
.box h1{font-size:40px}
.big{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 6px}
.card{margin:0 12px 12px;padding:14px 16px;border-radius:18px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 30%,transparent)}
.card h3{font-size:14px;color:var(--tx2);font-weight:500;margin-bottom:10px}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--tx);box-shadow:0 0 16px currentColor}
.flex{display:flex;gap:8px;align-items:center}
.tg{width:50px;height:28px;border-radius:14px;background:#777;position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--a3)}.tg.on::after{left:25px}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#rv.v0{opacity:0;width:1px;height:1px}
#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:100px;height:140px;object-fit:cover;border-radius:16px;background:#222;border:2px solid var(--a1);animation:pg 2s infinite;z-index:2}
#cav{position:absolute;left:50%;top:34%;width:0;height:0}
#cav .ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid var(--a1);box-shadow:0 0 16px var(--a1);animation:rp 2.4s infinite}
#cav .av{position:absolute;left:-52px;top:-52px}
#cinfo{position:absolute;left:0;right:0;top:calc(34% + 80px);text-align:center;text-shadow:0 2px 10px #000;color:#fff;z-index:2}
#cn{font-size:28px;font-weight:900}#cs{margin-top:6px;color:var(--a3);font-size:16px}
#cb{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:3}
#cb button{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
#cb button.off{background:#fff;color:#222}
#cb .no{background:#ff3b5c;border:0;animation:pu 1.6s infinite}#cb .ok{background:var(--a3);border:0;color:#012;animation:pg 1.6s infinite}
#lb{background:rgba(0,0,0,.92);z-index:12;align-items:center;justify-content:center}#lb img{max-width:96%;max-height:90%}
#tt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 16px;border-radius:12px;z-index:20;max-width:90%;text-align:center;border:1px solid var(--a1)}
.sys{text-align:center;color:var(--tx2);font-size:13px;margin:10px 0;animation:si .3s both}.sys a{color:var(--a1);cursor:pointer;margin-left:6px}
.rcb{align-self:center;background:var(--bar);border:1px solid color-mix(in srgb,var(--a1) 45%,transparent);color:var(--a1);border-radius:10px;padding:4px 12px;font-size:13px;flex:none;animation:si .2s both}
.bb.rp,.me .bb.rp{padding:0;min-width:220px;background:linear-gradient(135deg,#ff5a5a,#c8102e);color:#fff;animation:none;border:1px solid #ffd77a;box-shadow:0 4px 22px rgba(255,60,60,.5);cursor:pointer;font-weight:500}
.bb.rp.done{filter:saturate(.45) brightness(.82)}
.rpc{display:flex;gap:10px;align-items:center;padding:12px 14px;position:relative;overflow:hidden}
.rpc::after{content:"";position:absolute;top:0;bottom:0;width:50px;left:-70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sw2 3s infinite}
.rpc small{display:block;font-size:12px;opacity:.85}
.rpf{background:rgba(0,0,0,.22);font-size:11px;padding:4px 14px}
.rpi{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff1b8,#ffc861);color:#b3121f;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px #ffd77a;flex:none}
.rpc2{border-radius:16px;background:linear-gradient(135deg,#ff5a5a,#c8102e);border:1px solid #ffd77a;color:#fff;margin-bottom:12px;box-shadow:0 4px 22px rgba(255,60,60,.5)}
#more{display:flex;gap:22px;margin:0 12px;padding:14px 18px;border-radius:18px;background:var(--bar);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent)}
.mi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--tx2);cursor:pointer}
.mic2{width:56px;height:56px;border-radius:16px;background:var(--gl);color:var(--a1);display:flex;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--a1) 35%,transparent)}
.mic2.rd{background:linear-gradient(135deg,#ff5a5a,#c8102e);color:#ffe08a;border-color:#ffd77a;box-shadow:0 0 18px rgba(255,60,60,.5)}
.rpbtn{width:100%;background:linear-gradient(135deg,#ff5a5a,#c8102e);color:#ffe08a;font-size:18px;padding:14px;border:1px solid #ffd77a;animation:pu 1.8s infinite}
.amt{font-size:34px;font-weight:900;color:var(--a1);margin:2px 0 10px;text-shadow:0 0 16px color-mix(in srgb,var(--a1) 60%,transparent)}
#rpo{background:rgba(0,0,0,.8);z-index:15;align-items:center;justify-content:center}
.env{position:relative;width:290px;height:420px;border-radius:22px;background:linear-gradient(160deg,#ff5a5a,#c8102e 70%,#8e0b20);border:2px solid #ffd77a;box-shadow:0 0 60px rgba(255,80,80,.6);color:#fff;text-align:center;overflow:hidden;animation:pop .5s both}
.env .cap{height:150px;border-radius:0 0 50% 50%/0 0 40% 40%;background:linear-gradient(180deg,#e0222f,#b00d1f);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.env .who{padding-top:22px;font-size:17px;font-weight:700}.env .cap small{display:block;margin-top:4px}
.k{position:absolute;left:50%;top:112px;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff1b8,#ffc861 60%,#e0a030);color:#b3121f;font-size:32px;font-weight:900;box-shadow:0 0 24px #ffd77a;animation:pg 1.6s infinite}
.k.spin{animation:flip .7s linear infinite}
.env .note{margin-top:80px;font-size:20px;font-weight:700;padding:0 20px}
.env .big2{margin-top:56px;font-size:46px;font-weight:900;color:#ffe08a;text-shadow:0 0 18px #ffc861}
.cf{position:absolute;top:-14px;width:8px;height:12px;animation:cf linear forwards}
@keyframes sw2{0%{left:-70px}60%,100%{left:300px}}
@keyframes flip{to{transform:rotateY(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes cf{to{transform:translateY(480px) rotate(720deg);opacity:.2}}
.ni{display:flex;gap:12px;padding:14px 16px;margin:0 12px 10px;border-radius:16px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 22%,transparent);cursor:pointer;animation:si .4s both}
.nt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}.nt b{font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--tx2)}
.hotb{font-style:normal;background:#ff4f4f;color:#fff;border-radius:4px;padding:0 5px;font-size:11px}
.th{width:112px;height:78px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.ncat{display:flex;gap:20px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}.ncat button{color:var(--tx2);font-size:17px;white-space:nowrap;padding:4px 0;position:relative}.ncat button.on{color:var(--tx);font-weight:800}.ncat button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-2px;height:3px;border-radius:2px;background:var(--a1);box-shadow:0 0 10px var(--a1)}
.bn{position:relative;height:150px;margin:0 12px 12px;border-radius:18px;overflow:hidden;box-shadow:0 0 24px color-mix(in srgb,var(--a1) 25%,transparent)}
.bn div{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);opacity:0;animation:bn 12s infinite;cursor:pointer}
.hr{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:15px}.hr i{font-style:normal;font-weight:900;width:20px;color:var(--tx2)}.hr:nth-child(2) i{color:#ff4f4f}.hr:nth-child(3) i{color:#ff9a3c}.hr:nth-child(4) i{color:#ffc861}
.ring2{position:relative;width:220px;height:220px;margin:0 auto}.rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rn b{font-size:44px;font-weight:900;color:var(--a1);text-shadow:0 0 16px color-mix(in srgb,var(--a1) 60%,transparent)}.rn small{color:var(--tx2)}
.rk{width:24px;text-align:center;font-size:18px;color:var(--tx2)}
.fc{display:flex;gap:10px;align-items:center;min-width:200px;text-decoration:none;color:inherit}
.fi{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#4fd8ff,#8a6bff);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
.fc small{display:block;font-size:12px;opacity:.75}.fc b{font-weight:600;word-break:break-all}
.txc{margin:0 14px 12px;padding:14px 16px;border-radius:18px;background:var(--gl);border:1px solid color-mix(in srgb,var(--a1) 28%,transparent);animation:si .4s both}
.txh{display:flex;justify-content:space-between;align-items:center}.txh small{color:var(--tx2)}
.txa{font-size:36px;font-weight:900;margin:6px 0}.txa.in{color:var(--a3)}.txa.out{color:#ff6b7a}.txa.adj{color:var(--a1)}
.txd{font-size:13px;color:var(--tx2);line-height:1.7;border-top:1px solid color-mix(in srgb,var(--a1) 18%,transparent);padding-top:8px}
#nt{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:30;padding:12px 14px;border-radius:16px;background:var(--bar);border:1px solid var(--a3);box-shadow:0 0 24px color-mix(in srgb,var(--a3) 40%,transparent);animation:dn .4s both;font-size:14px}
.ah{font-size:22px;line-height:1.4;margin-bottom:8px}.ahero{height:160px;border-radius:16px;margin:14px 0}#artb p{line-height:1.8;margin-bottom:14px}
@keyframes bn{0%{opacity:0}5%,30%{opacity:1}36%,100%{opacity:0}}
@keyframes dn{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.gn{font-size:12px;color:var(--a1);margin-bottom:2px;font-weight:600}
.tm{font-size:11px;opacity:.65;text-align:right;margin-top:3px}.rd{color:#19e3a1}.me .rd{color:#0a7a52}
.m.pend .bb{opacity:.55}

.rcw{align-self:center;display:flex;gap:6px;flex:none}

async function signup(){
  const em=$('#em').value.trim(),pw=$('#pw').value;

}

// ---------- 好友 ----------
async function loadRel(){
  const {data}=await sb.from('friendships').select('*').or(`requester.eq.${me.id},addressee.eq.${me.id}`);
  rel=data||[];
  const other=r=>r.requester==me.id?r.addressee:r.requester;
  const ids=[...new Set(rel.map(other))];
  const ps=ids.length?(await sb.from('profiles').select('*').in('id',ids)).data||[]:[];
  const pm=Object.fromEntries(ps.map(p=>[p.id,p]));
  friends=rel.filter(r=>r.status=='accepted').map(r=>pm[other(r)]).filter(Boolean);
  reqs=rel.filter(r=>r.status=='pending'&&r.addressee==me.id).map(r=>({id:r.id,p:pm[r.requester]})).filter(r=>r.p);
  if(tab=='chats'&&prof)renderChats();
}
async function loadLast(){
  const {data}=await sb.from('messages').select('*').or(`sender.eq.${me.id},receiver.eq.${me.id}`).order('created_at',{ascending:false}).limit(300);
  last={};(data||[]).forEach(m=>{const k=m.sender==me.id?m.receiver:m.sender;if(!last[k])last[k]=m});
}
async function acc(id){await sb.from('friendships').update({status:'accepted'}).eq('id',id);loadRel()}
async function rej(id){await sb.from('friendships').delete().eq('id',id);loadRel()}

async function addF(id){

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},...TURN]};
let pc,stream,peer,pend=[],offerIn=null,chs={},facing='user',isVideo=false,tint=null,tsec=0,inTO=null,outTO=null;
const chan=to=>chs[to]||(chs[to]=new Promise(r=>{const c=sb.channel('sig-'+to);c.subscribe(s=>{if(s=='SUBSCRIBED')r(c)})}));
async function sendSig(to,p){(await chan(to)).send({type:'broadcast',event:'sig',payload:{...p,from:me.id}})}
async function media(video){
  facing='user';
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:{ideal:'user'},width:{ideal:720}}:false});return true}
  catch(e){toast(permMsg(e));return false}
}
function showCall(video,txt,incoming){
  isVideo=video;$('#call').classList.remove('h');
  $('#cn').textContent=peer.username;$('#cs').textContent=txt;
  $('#cav').innerHTML=`<div class="ring"></div><div class="ring" style="animation-delay:.8s;border-color:var(--a2)"></div><div class="ring" style="animation-delay:1.6s;border-color:var(--a3)"></div>${av(peer,104,1)}`;
  $('#cav').classList.remove('h');$('#rv').classList.add('v0');
  $('#lv').classList.toggle('h',!video||incoming);
  $('#ca').classList.toggle('h',!incoming);
  $('#cm').classList.toggle('h',incoming);
  $('#cc').classList.toggle('h',!video||incoming);$('#cf').classList.toggle('h',!video||incoming);
  ['cm','cc'].forEach(i=>$('#'+i).classList.remove('off'));
}
function mkPc(){
  pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(x=>pc.addTrack(x,stream));
  pc.onicecandidate=e=>e.candidate&&sendSig(peer.id,{k:'ice',c:e.candidate});
  pc.ontrack=e=>{
    $('#rv').srcObject=e.streams[0];clearTimeout(outTO);stopRing();
    if(e.track.kind=='video'){$('#rv').classList.remove('v0');$('#cav').classList.add('h')}
    if(!tint){tsec=0;$('#cs').textContent='00:00';tint=setInterval(()=>{tsec++;$('#cs').textContent=String(Math.floor(tsec/60)).padStart(2,'0')+':'+String(tsec%60).padStart(2,'0')},1000)}
  };
  pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState=='failed'){toast(t('callfail'));endCall(true)}};
  $('#lv').srcObject=stream;$('#lv').style.transform='scaleX(-1)';
}
async function startCall(video){
  if(pc||offerIn||!cur||cur.group||cur.special)return;
  if(!navigator.onLine)return toast(t('offline2'));
  peer=cur;
  if(!await media(video))return;
  showCall(video,t('calling'),false);mkPc();startRingback();
  outTO=setTimeout(()=>{if(pc&&!tint){toast(t('noanswer'));endCall(true)}},30000);
  const o=await pc.createOffer();await pc.setLocalDescription(o);
  sendSig(peer.id,{k:'offer',video,sdp:pc.localDescription});
}
async function onSig(p){
  if(p.k=='typing'){if(cur&&cur.id==p.from){typingUntil=Date.now()+3000;updHead();setTimeout(updHead,3100)}return}
  if(p.k=='offer'){
    const f=friends.find(x=>x.id==p.from);if(!f||BL.has(p.from))return;
    if(pc||offerIn)return sendSig(p.from,{k:'bye',busy:1});
    offerIn=p;peer=f;pend=[];startRing();
    inTO=setTimeout(()=>{if(offerIn){sendSig(peer.id,{k:'bye'});endCall(false)}},30000);
    showCall(p.video,f.username+t('inv'),true);
    pushNoti(f.username,t('inv').trim(),'call'+f.id,()=>{});
  }else if(peer&&p.from==peer.id){
    if(p.k=='answer'&&pc)await pc.setRemoteDescription(p.sdp);
    else if(p.k=='ice'){if(pc&&pc.remoteDescription)pc.addIceCandidate(p.c).catch(()=>{});else pend.push(p.c)}
    else if(p.k=='bye'){if(p.busy)toast(t('busy2'));endCall(false)}
  }
}
async function acceptCall(){
  stopRing();clearTimeout(inTO);
  const p=offerIn;offerIn=null;
  if(!await media(p.video)){sendSig(peer.id,{k:'bye'});return endCall(false)}
  showCall(p.video,t('ing'),false);mkPc();
  await pc.setRemoteDescription(p.sdp);
  pend.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pend=[];
  const a=await pc.createAnswer();await pc.setLocalDescription(a);
  sendSig(peer.id,{k:'answer',sdp:pc.localDescription});
}
function toggleMute(b){const tr=stream&&stream.getAudioTracks()[0];if(!tr)return;tr.enabled=!tr.enabled;b.classList.toggle('off',!tr.enabled)}
function toggleCam(b){const tr=stream&&stream.getVideoTracks()[0];if(!tr)return;tr.enabled=!tr.enabled;b.classList.toggle('off',!tr.enabled)}
async function flipCam(){
  if(!stream||!pc)return;
  const nf=facing=='user'?'environment':'user';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:nf}}});
    const nt=s.getVideoTracks()[0],ot=stream.getVideoTracks()[0];
    const sd=pc.getSenders().find(x=>x.track&&x.track.kind=='video');
    if(sd)await sd.replaceTrack(nt);
    if(ot){stream.removeTrack(ot);ot.stop()}
    stream.addTrack(nt);facing=nf;
    $('#lv').srcObject=stream;$('#lv').style.transform=nf=='user'?'scaleX(-1)':'none';
  }catch(e){toast(t('nomic'))}
}
function hangup(){if(offerIn){sendSig(peer.id,{k:'bye'})}endCall(!offerIn)}
function endCall(notify){
  if(notify&&peer)sendSig(peer.id,{k:'bye'});
  stopRing();clearTimeout(inTO);clearTimeout(outTO);
  if(pc){pc.close();pc=null}
  if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  clearInterval(tint);tint=null;
  offerIn=null;pend=[];$('#rv').srcObject=null;$('#lv').srcObject=null;$('#call').classList.add('h');
}

// ---------- 声音（提示音 / 铃声）----------
let AC=null,ringT=null,vibT=null,hinted=false,gestured=false;
function actx(){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!='running')AC.resume();return AC}catch(e){return null}
}
function unlockAudio(){
  gestured=true;const a=actx();if(!a)return;
  try{const b=a.createBuffer(1,1,22050),x=a.createBufferSource();x.buffer=b;x.connect(a.destination);x.start(0)}catch(e){}
}
['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
const vol=()=>Math.max(.05,Math.min(1,(SET.vol??80)/100));
function note(f,t0,d,v,type){
  const a=AC;if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t0;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,T);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),T+.02);
    g.gain.exponentialRampToValueAtTime(.0001,T+d);
    o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d+.05);
  }catch(e){}
}
function playSnd(kind,soft){
  if(!SET.snd||!actx())return;
  if(!gestured&&!hinted){hinted=true;toast(t('tapsound'))}
  const v=vol()*(soft?.35:1);
  if(kind=='spin'){sweep(380,1100,.65,.3*v);return}
  if(kind=='open'){
    [[1047,0],[1319,.09],[1568,.18],[2093,.27],[2637,.38]].forEach(([f,t0])=>bell(f,t0,.75,.5*v));
    note(3136,.56,.25,.35*v);note(3951,.64,.3,.3*v);
    if(SET.vib&&navigator.vibrate)try{navigator.vibrate([60,40,120])}catch(e){}
    return;
  }
  if(kind=='rp')[[784,0],[988,.12],[1319,.24],[1568,.36]].forEach(([f,t0])=>note(f,t0,.3,.55*v));
  else{note(880,0,.28,.6*v);note(1175,.14,.4,.6*v)}
  if(!soft&&SET.vib&&navigator.vibrate)try{navigator.vibrate(kind=='rp'?[80,60,80]:60)}catch(e){}
}
function bell(f,t0,d,v){note(f,t0,d,v);note(f*2.76,t0,d*.5,v*.25)}
function sweep(f1,f2,d,v){
  const a=AC;if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),T=a.currentTime;
    o.type='triangle';o.frequency.setValueAtTime(f1,T);o.frequency.exponentialRampToValueAtTime(f2,T+d);
    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),T+.08);g.gain.exponentialRampToValueAtTime(.0001,T+d);
    o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d+.05);
  }catch(e){}
}
function beep(){playSnd('msg')}
function ringOnce(){const v=vol();[[659,0],[784,.22],[659,.5],[784,.72]].forEach(([f,t0])=>note(f,t0,.2,.65*v,'triangle'))}
function startRing(){
  stopRing();
  if(SET.ring&&actx()){ringOnce();ringT=setInterval(ringOnce,2200)}
  if(SET.vib&&navigator.vibrate){const vb=()=>{try{navigator.vibrate([500,250,500])}catch(e){}};vb();vibT=setInterval(vb,2200)}
}
function startRingback(){
  stopRing();
  if(!SET.ring||!actx())return;
  const r=()=>note(440,0,.9,.3*vol(),'sine');
  r();ringT=setInterval(r,3000);
}
function stopRing(){clearInterval(ringT);clearInterval(vibT);ringT=null;vibT=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function testRing(){startRing();setTimeout(stopRing,3500)}

function place(d,pre,m){
  const box=$('#msgs');
  if(pre){box.prepend(d);return}
  const day=fday(m.created_at);
  if(day!=chatDay){chatDay=day;const x=document.createElement('div');x.className='sys';x.textContent=day;box.append(x)}
  box.append(d);box.scrollTop=1e9;
}
function copyText(x){
  const ok=()=>toast(t('copied'));
  const fb=()=>{const a=document.createElement('textarea');a.value=x;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(ok,fb);else fb();
}
async function compress(f,max,q){
  if(!f.type.startsWith('image/')||f.type=='image/gif'||f.type=='image/svg+xml')return f;
  try{
    const bm=await createImageBitmap(f);
    const k=Math.min(1,max/Math.max(bm.width,bm.height));
    if(k==1&&f.size<600000)return f;
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
function pushNoti(title,body,tag,open){
  if(!SET.noti||!('Notification' in window)||Notification.permission!='granted'||!document.hidden)return;
  try{const n=new Notification(title,{body,tag});n.onclick=()=>{window.focus();n.close();open&&open()}}catch(e){}
}
function togSet(k){
  SET[k]=SET[k]?0:1;
  if(k=='noti'&&SET.noti){
    if(!('Notification' in window)){SET.noti=0;toast(t('nonoti'))}
    else Notification.requestPermission().then(r=>{if(r!='granted'){SET.noti=0;toast(t('notidenied'))}saveSet();renderMe()});
  }
  if(k=='snd'&&SET.snd)beep();
  saveSet();renderMe();
}
function typing(){if(!cur||cur.group||cur.special)return;const n=Date.now();if(n-lastTyping<2500)return;lastTyping=n;sendSig(cur.id,{k:'typing'})}
function saveDraft(){if(curKey)DR[curKey]=$('#inp').value}
function loadDraft(){$('#inp').value=DR[curKey]||''}

// ---------- 升级：消息加载（分页）、发送状态、已读 ----------
async function fetchMsgs(before){
  let q;
  if(cur.group)q=sb.from('group_messages').select('*').eq('group_id',cur.gid);
  else{const a=me.id,b=cur.id;q=sb.from('messages').select('*').or(`and(sender.eq.${a},receiver.eq.${b}),and(sender.eq.${b},receiver.eq.${a})`)}
  if(before)q=q.lt('created_at',before);
  const {data,error}=await q.order('created_at',{ascending:false}).limit(PAGE);
  if(error){toast(errMsg(error));return null}
  return cur.group?data.map(gm):data;
}
async function loadRps(list){
  const ids=list.filter(m=>m.type=='redpacket').map(m=>m.id);if(!ids.length)return;
  const {data}=await sb.from('red_packets').select('msg_id,status,amount,expires_at').in('msg_id',ids);
  (data||[]).forEach(r=>RPS[r.msg_id]=r);
}
async function loadMsgs(){
  $('#msgs').innerHTML='';chatDay='';oldest=null;hasMore=false;
  const list=await fetchMsgs(null);if(!list)return;
  const asc=[...list].reverse();
  await loadRps(asc);
  asc.forEach(m=>addMsg(m));
  oldest=asc.length?asc[0].created_at:null;hasMore=list.length>=PAGE;
  $('#msgs').scrollTop=1e9;
}
async function loadOlder(){
  if(loadingMore||!hasMore||!cur||!oldest)return;loadingMore=true;
  const box=$('#msgs'),h0=box.scrollHeight;
  const list=await fetchMsgs(oldest);
  if(list&&list.length){await loadRps(list);list.forEach(m=>addMsg(m,true));oldest=list[list.length-1].created_at;hasMore=list.length>=PAGE;box.scrollTop=box.scrollHeight-h0}
  else hasMore=false;
  loadingMore=false;
}
async function doSend(tmp,c){
  let r;
  if(c.group)r=await sb.from('group_messages').insert({group_id:c.gid,sender:me.id,type:tmp.type,content:tmp.content}).select().single();
  else r=await sb.from('messages').insert({sender:me.id,receiver:c.id,type:tmp.type,content:tmp.content}).select().single();
  const el=document.querySelector('[data-mid="'+tmp.id+'"]');
  if(r.error){
    tmp._pending=0;tmp._fail=1;tmp._c=c;
    toast(r.error.code=='42501'?t('blockedmsg'):errMsg(r.error));
    if(el)paint(el,tmp);return;
  }
  const real=c.group?gm(r.data):r.data;
  last[c.id]=real;MS[real.id]=real;delete MS[tmp.id];
  if(el){el.dataset.mid=real.id;paint(el,real)}
  return real;
}
function retry(id){const tmp=MS[id];if(!tmp)return;tmp._fail=0;tmp._pending=1;paintById(id);doSend(tmp,tmp._c||cur)}
function markRead(peer){if(!peer||peer==me.id||String(peer)[0]=='g')return;sb.rpc('mark_read',{p_peer:peer}).then(()=>{},()=>{})}
function onMsgUpd(m,g){
  const key=g?'g'+m.id:m.id,x=MS[key];
  if(x){x.recalled=m.recalled;if(!g)x.read_at=m.read_at;paintById(key)}
  Object.keys(last).forEach(k=>{if(last[k]&&last[k].id==key){last[k].recalled=m.recalled}});
  if(tab=='chats')renderChats();
}
async function loadUnread(){
  const {data}=await sb.from('messages').select('sender').eq('receiver',me.id).is('read_at',null).neq('sender',me.id).limit(1000);
  Object.keys(unread).forEach(k=>{if(String(k)[0]!='g')delete unread[k]});
  (data||[]).forEach(x=>unread[x.sender]=(unread[x.sender]||0)+1);
}
async function loadBlocks(){const {data}=await sb.from('blocks').select('blocked').eq('blocker',me.id);BL=new Set((data||[]).map(x=>x.blocked))}
async function resync(){
  if(!me||!prof||syncing)return;syncing=true;
  try{await Promise.all([loadRel(),loadLast(),loadUnread()]);await loadGroups();await refreshWallet();runRefund();if(cur)await loadMsgs();if(tab=='chats')renderChats()}
  finally{syncing=false}
}

// ---------- 升级：钱包（数据库）----------
const nameOf=id=>{const f=friends.find(x=>x.id==id);if(f)return f.username;for(const k in GM){const m=(GM[k]||[]).find(x=>x&&x.id==id);if(m)return m.username}return ''};
async function loadWallet(){
  const init=parseFloat(localStorage.bal);
  const {data,error}=await sb.rpc('ensure_wallet',{p_init:isNaN(init)?1000:init});
  if(error){walletOk=false;return}
  walletOk=true;bal=+data;localStorage.removeItem('bal');
  await loadTx();
}
async function loadBal(){const {data}=await sb.from('wallets').select('balance').eq('user_id',me.id).maybeSingle();if(data)bal=+data.balance}
async function loadTx(){
  const {data}=await sb.from('wallet_tx').select('*').order('id',{ascending:false}).limit(60);
  TX=(data||[]).map(r=>({id:r.id,t:new Date(r.created_at).getTime(),type:r.type,amt:+r.amount,bal:+r.balance_after,who:nameOf(r.counterparty)}));
  const top=TX[0];
  if(top){if(txInit&&top.id>lastTxId)notify(top);lastTxId=Math.max(lastTxId,top.id)}
  txInit=true;
  const w=$('#wb');if(w)w.textContent='¥ '+bal.toFixed(2);
  if(tab=='chats')renderChats();
}
async function refreshWallet(){await loadBal();await loadTx()}
async function runRefund(){
  const {data,error}=await sb.rpc('refund_expired_red_packets');
  if(error||!data||!data.length)return;
  data.forEach(r=>{RPS[r.out_msg]=Object.assign(RPS[r.out_msg]||{},{status:'refunded'});paintById(r.out_msg)});
  await refreshWallet();toast(t('rprefunded'));
}

// ---------- 升级：好友资料 / 拉黑 / 群成员 ----------
function headAct(){if(!cur)return;if(cur.group)openGi();else openFc()}
function openFc(){
  const f=cur,bl=BL.has(f.id);
  $('#fcb').innerHTML=`<div class="big">${av(f,92,1)}<b style="font-size:20px">${esc(f.username)}</b><small style="color:var(--tx2)">${online.has(f.id)?t('online'):t('offline')}</small></div>
  <div style="padding:6px 12px;display:grid;gap:10px"><button class="btn g" onclick="toggleBlock()">${bl?t('unblock'):t('block')}</button><button class="btn g" style="color:#ff6b7a" onclick="delFriend()">${t('delfr')}</button></div>`;
  $('#fc').classList.remove('h');
}
async function toggleBlock(){
  const id=cur.id;
  if(BL.has(id)){const {error}=await sb.from('blocks').delete().eq('blocker',me.id).eq('blocked',id);if(error)return toast(errMsg(error));BL.delete(id);toast(t('unblocked'))}
  else{const {error}=await sb.from('blocks').insert({blocker:me.id,blocked:id});if(error)return toast(errMsg(error));BL.add(id);toast(t('blockedok'))}
  openFc();
}
async function rmMem(uid){
  if(!confirm(t('gq')))return;
  const {error}=await sb.from('group_members').delete().eq('group_id',cur.gid).eq('user_id',uid);
  if(error)return toast(errMsg(error));
  await loadGroups();updHead();openGi();
}

// ---------- 升级：全局监听 ----------
$('#msgs').addEventListener('scroll',()=>{if($('#msgs').scrollTop<60)loadOlder()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(rec&&rec.state=='recording'){recCancel=true;rec.stop()}}
  else{actx();if(cur&&!cur.group&&!cur.special)markRead(cur.id);if(me&&Date.now()-hiddenAt>30000)resync()}
});
window.addEventListener('offline',()=>$('#net').classList.remove('h'));
window.addEventListener('online',()=>{$('#net').classList.add('h');toast(t('backonline'));resync()});
document.addEventListener('keydown',e=>{
  if(e.key!='Escape')return;
  for(const id of ['lb','rpo','rpm','fc','gi','gc','txp','art']){const el=$('#'+id);if(el&&!el.classList.contains('h')){el.classList.add('h');return}}
  if(!$('#chat').classList.contains('h'))closeChat();
});
let errN=0;
window.addEventListener('error',e=>{if(errN++>4||!me)return;sb.from('client_errors').insert({msg:String(e.message).slice(0,300),url:location.href,ua:navigator.userAgent.slice(0,200)}).then(()=>{},()=>{})});
sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&me)location.reload()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

// ---------- 启动 ----------
applyTheme();applyLang();document.documentElement.lang=lang;
sb.auth.getSession().then(({data})=>data.session?start(data.session.user):show('auth'));
</script>
